<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>한화시스템 ICT 부스 이벤트</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700&display=swap">
<style>
  :root {
    --paper: #F2F3F5; --card: #FFFFFF; --ink: #151A22; --steel: #586271; --line: #D8DDE4;
    --orange: #F37321; --orange-deep: #A84608; --deep: #18212F; --ok: #1B7F56; --bad: #B3261E;
    --body: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --num: "Saira Condensed", "Pretendard Variable", Pretendard, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; word-break: keep-all; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .wrap { max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; background: var(--paper); }

  .top { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; background: var(--card); border-bottom: 1px solid var(--line); }
  .top .brand { font-weight: 800; font-size: 15px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
  .top .brand::before { content: ""; width: 10px; height: 10px; background: var(--orange); border-radius: 2px; }
  .top .brand img { width: 26px; height: 26px; border-radius: 6px; display: block; }
  .top .brand.has-logo::before { display: none; }
  .top .expo { font-size: 13px; color: var(--steel); }
  .demo { background: var(--deep); color: #fff; font-size: 12.5px; padding: 7px 20px; }

  main { flex: 1; padding: 24px 20px 32px; display: flex; flex-direction: column; }
  h1 { font-size: 30px; line-height: 1.22; letter-spacing: -0.03em; font-weight: 800; margin: 8px 0 14px; white-space: pre-line; }
  h2 { font-size: 22px; line-height: 1.3; letter-spacing: -0.02em; font-weight: 800; margin: 0 0 6px; }
  h3 { font-size: 16px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  p { margin: 0 0 12px; }
  .lede { color: var(--steel); font-size: 16px; }
  .muted { color: var(--steel); font-size: 14px; }
  .spacer { flex: 1; min-height: 20px; }

  .btn { display: block; width: 100%; border: 0; border-radius: 10px; padding: 16px 18px; font-size: 17px; font-weight: 700; background: var(--orange); color: var(--ink); text-align: center; text-decoration: none; }
  .btn:disabled { background: #E3E6EA; color: #8B939E; cursor: default; }
  .btn.ghost { background: transparent; border: 1.5px solid var(--ink); }
  .btn.dark { background: var(--deep); color: #fff; }
  .btn.small { padding: 11px 14px; font-size: 15px; width: auto; display: inline-block; }
  .linkbtn { background: none; border: 0; padding: 8px 0; color: var(--steel); text-decoration: underline; font-size: 14px; }
  .err { color: var(--bad); font-size: 14px; font-weight: 600; min-height: 22px; margin: 8px 0; }

  /* 참여 순서 - 실제로 순서가 있는 4단계 */
  .steps { list-style: none; margin: 22px 0 0; padding: 0; background: var(--card); border-radius: 14px; position: relative; overflow: hidden; }
  .steps li { display: flex; gap: 14px; align-items: baseline; padding: 15px 18px 15px 22px; border-bottom: 1.5px dashed var(--line); }
  .steps li:last-child { border-bottom: 0; }
  .steps::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--orange); }
  .steps .n { font-family: var(--num); font-weight: 700; font-size: 26px; line-height: 1; width: 18px; color: var(--orange-deep); }
  .steps b { display: block; font-size: 16px; }
  .steps span { color: var(--steel); font-size: 14px; }

  /* 입력 */
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .field label i { font-style: normal; color: var(--orange-deep); }
  .field input, .field textarea { width: 100%; background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 13px 14px; font-size: 16px; }
  .field input:focus, .field textarea:focus { outline: 0; border-color: var(--ink); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .consent { background: var(--card); border-radius: 12px; padding: 4px 14px; margin: 18px 0 4px; }
  .consent .item { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .consent .item:last-child { border-bottom: 0; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; font-weight: 600; }
  .check input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--orange-deep); flex: none; }
  details { margin: 6px 0 0 32px; font-size: 13px; color: var(--steel); }
  details summary { cursor: pointer; text-decoration: underline; }
  details ul { margin: 8px 0 0; padding-left: 16px; }

  /* 설문 */
  .progress { display: flex; gap: 4px; margin-bottom: 22px; }
  .progress i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
  .progress i.on { background: var(--orange); }
  .qno { font-family: var(--num); font-size: 18px; font-weight: 700; color: var(--orange-deep); }
  .opts { display: grid; gap: 9px; margin: 18px 0 8px; }
  .opt { text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 14px 16px; font-size: 16px; font-weight: 600; }
  .opt small { display: block; font-weight: 400; color: var(--steel); font-size: 13.5px; margin-top: 2px; }
  .opt.on { border-color: var(--ink); background: var(--deep); color: #fff; }
  .opt.on small { color: #C3CAD4; }

  /* 룰렛 */
  .wheelbox { position: relative; width: min(84vw, 330px); margin: 22px auto 10px; aspect-ratio: 1; }
  .wheelbox svg { width: 100%; height: 100%; display: block; transition: transform 4.6s cubic-bezier(.12,.72,.1,1); }
  .pointer { position: absolute; left: 50%; top: -8px; transform: translateX(-50%); width: 0; height: 0; border-left: 13px solid transparent; border-right: 13px solid transparent; border-top: 24px solid var(--ink); z-index: 2; }
  .result { background: var(--card); border-radius: 14px; padding: 20px; text-align: center; margin-top: 14px; border: 2px solid var(--ink); }
  .result .prize { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; margin: 2px 0 8px; }

  /* 패스 카드 - 이 화면의 중심 */
  .pass { background: var(--deep); color: #fff; border-radius: 16px; position: relative; overflow: hidden; padding: 20px 20px 18px 30px; }
  .pass::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 10px; background: var(--orange); }
  .pass .lbl { font-size: 13px; color: #B9C1CC; }
  .pass .no { font-family: var(--num); font-weight: 700; font-size: 84px; line-height: .95; letter-spacing: 0.02em; margin: 2px 0 10px; }
  .pass .who { font-size: 17px; font-weight: 700; }
  .pass .co { font-size: 14px; color: #B9C1CC; }
  .pass .cut { border-top: 1.5px dashed #47536A; margin: 16px -20px 14px -20px; }
  .pass .note { font-size: 13.5px; color: #D5DAE1; margin: 0; }

  .card { background: var(--card); border-radius: 14px; padding: 18px; margin-top: 14px; }
  .win { border: 2px solid var(--orange); }
  .code { font-family: var(--num); font-weight: 700; font-size: 44px; letter-spacing: 0.14em; line-height: 1.1; }
  .tag { display: inline-block; font-size: 12.5px; font-weight: 700; padding: 3px 9px; border-radius: 20px; background: #E7F3EC; color: var(--ok); }
  .sec { margin: 28px 0 0; }
  .sec > p { margin-bottom: 0; }
  .sol { background: var(--card); border-radius: 14px; margin-top: 12px; overflow: hidden; }
  .sol header { padding: 16px 18px 12px; }
  .sol header p { margin: 4px 0 0; font-size: 14px; color: var(--steel); }
  .mat { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 13px 18px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; font-size: 15px; font-weight: 600; text-decoration: none; color: var(--ink); }
  .mat .kind { flex: none; font-size: 12.5px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: var(--paper); color: var(--steel); min-width: 44px; text-align: center; }
  .mat .t { flex: 1; }
  .mat .seen { flex: none; font-size: 12.5px; color: var(--ok); font-weight: 700; }

  /* 시트(모달) */
  .scrim { position: fixed; inset: 0; background: rgba(21,26,34,.55); display: none; align-items: flex-end; justify-content: center; z-index: 20; }
  .scrim.on { display: flex; }
  .sheet { background: var(--card); width: 100%; max-width: 480px; border-radius: 18px 18px 0 0; padding: 22px 20px 26px; max-height: 92vh; overflow: auto; }
  .sheet .close { float: right; background: none; border: 0; font-size: 15px; color: var(--steel); padding: 4px 0 4px 12px; text-decoration: underline; }
  .player { width: 100%; aspect-ratio: 16/9; background: #000; border: 0; border-radius: 10px; margin: 12px 0; display: block; }
  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 10px; font-size: 15px; font-weight: 600; z-index: 30; display: none; max-width: 88vw; }
  .toast.on { display: block; }
  .loading { text-align: center; color: var(--steel); padding: 80px 0; }

  @media (prefers-reduced-motion: reduce) { .wheelbox svg { transition-duration: .01s; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand" id="brand"></div>
    <div class="expo" id="expo"></div>
  </div>
  <div class="demo" id="demo" hidden>데모 모드입니다. 입력한 내용은 이 브라우저에만 저장됩니다.</div>
  <main id="app"><div class="loading">불러오는 중입니다</div></main>
</div>
<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

(function () {

/* ==========================================================================

 * 점수 기준을 바꾸려면 HS_SCORE 와 HS_GRADE 만 수정하세요.
 * ========================================================================== */
var HS_VERSION = '1.0.0';

var HS_LEAD_FIELDS = ['id', 'seq', 'token', 'createdAt', 'source', 'name', 'company', 'dept', 'title',
  'email', 'phone', 'consentPrivacy', 'consentMarketing', 'surveyAt', 'industry', 'companySize', 'role',

  'claimedAt', 'staffRating', 'staffNote', 'salesStatus', 'updatedAt'];
var HS_LEAD_NUMS = ['seq', 'pdfViews', 'videoViews', 'linkViews', 'score'];
var HS_PRIZE_FIELDS = ['id', 'name', 'win', 'total', 'remaining', 'weight'];
var HS_PRIZE_NUMS = ['total', 'remaining', 'weight'];
var HS_CONTENT_FIELDS = ['id', 'solution', 'type', 'title', 'url'];
var HS_DRAW_FIELDS = ['id', 'at', 'prize', 'leadId', 'seq', 'name', 'company', 'phone', 'status'];
var HS_DRAW_NUMS = ['seq'];
var HS_EVENT_FIELDS = ['at', 'leadId', 'kind', 'detail'];

/* ---- 리드 점수 기준 (설문 보기의 id 와 일치해야 합니다. config.js 참고) ---- */
var HS_SCORE = {
  role: { decision: 25, evaluate: 20, user: 10, research: 5, other: 0 },
  timeline: { m3: 30, m6: 22, y1: 12, undecided: 4, none: 0 },
  companySize: { s1000: 10, s300: 8, s50: 5, s0: 2 },
  interestEach: 2, interestMax: 6,
  consult: 30,
  pdfEach: 4, pdfMax: 12,
  videoEach: 3, videoMax: 9,
  linkEach: 2, linkMax: 6,
  staff: { A: 20, B: 10, C: 0 }
};
var HS_GRADE = { hot: 70, warm: 40 };   // 70점 이상 Hot, 40점 이상 Warm, 그 아래 Cold

/* ---- 처음 설치할 때 시트에 들어가는 기본값 (설치 후에는 시트에서 직접 수정) ---- */
var HS_SOLUTION_PAGE = 'https://www.hanwhasystems.com/ict/kr/business/solution/';
var HS_SEED = {

  ],
  contents: [

    { id: 'mes-video', solution: 'mes', type: 'video', title: 'XPERION MES 소개 영상', url: '' },
    { id: 'mes-link', solution: 'mes', type: 'link', title: 'XPERION MES 솔루션 페이지', url: HS_SOLUTION_PAGE + 'mes.do' },

    { id: 'iot-video', solution: 'iot', type: 'video', title: 'XPERION IoT 소개 영상', url: '' },
    { id: 'iot-link', solution: 'iot', type: 'link', title: 'XPERION IoT 솔루션 페이지', url: HS_SOLUTION_PAGE + 'iiot.do' },
    { id: 'wms-pdf', solution: 'wms', type: 'pdf', title: 'XPERION WMS 소개서', url: '' },
    { id: 'wms-video', solution: 'wms', type: 'video', title: 'XPERION WMS 소개 영상', url: '' },
    { id: 'wms-link', solution: 'wms', type: 'link', title: 'XPERION WMS 솔루션 페이지', url: HS_SOLUTION_PAGE + 'wms.do' },
    { id: 'plm-pdf', solution: 'plm', type: 'pdf', title: 'XPERION PLM 소개서', url: '' },
    { id: 'plm-video', solution: 'plm', type: 'video', title: 'XPERION PLM 소개 영상', url: '' },
    { id: 'haru-pdf', solution: 'haru', type: 'pdf', title: 'HARU 소개서', url: '' },
    { id: 'haru-video', solution: 'haru', type: 'video', title: 'HARU 소개 영상', url: '' },
    { id: 'haru-link', solution: 'haru', type: 'link', title: 'HARU 솔루션 페이지', url: HS_SOLUTION_PAGE + 'hrm.do' },
    { id: 'tomms-pdf', solution: 'tomms', type: 'pdf', title: 'TOMMS 소개서', url: '' },
    { id: 'tomms-video', solution: 'tomms', type: 'video', title: 'TOMMS 소개 영상', url: '' },
    { id: 'tomms-link', solution: 'tomms', type: 'link', title: 'TOMMS 솔루션 페이지', url: HS_SOLUTION_PAGE + 'mro.do' },
    { id: 'esg-pdf', solution: 'esg', type: 'pdf', title: 'ESG ON 소개서', url: '' },
    { id: 'esg-video', solution: 'esg', type: 'video', title: 'ESG ON 소개 영상', url: '' },
    { id: 'esg-link', solution: 'esg', type: 'link', title: 'ESG ON 솔루션 페이지', url: HS_SOLUTION_PAGE + 'esg.do' }
  ]
};

/* ------------------------------ 작은 도구들 ------------------------------ */
function hsNow() {
  return new Date(Date.now() + 9 * 3600 * 1000).toISOString().replace('T', ' ').slice(0, 19); // 한국 시간
}
function hsPad(n, len) { var s = String(n); while (s.length < len) s = '0' + s; return s; }
function hsErr(code, message) { return { ok: false, error: code, message: message }; }
function hsClean(v, max) {
  v = (v == null ? '' : String(v)).replace(/[\u0000-\u001f\u007f]/g, ' ').replace(/\s+/g, ' ').trim();
  v = v.replace(/^[=+\-@\s]+/, '');          // 스프레드시트 수식으로 해석되는 문자 제거
  return v.slice(0, max || 100);
}
function hsPhone(v) {
  var d = String(v == null ? '' : v).replace(/\D/g, '');
  if (d.indexOf('82') === 0 && d.length >= 11) d = '0' + d.slice(2);
  if (!/^01[016789]\d{7,8}$/.test(d)) return '';
  return d.slice(0, 3) + '-' + d.slice(3, d.length - 4) + '-' + d.slice(-4);
}
function hsEmail(v) {
  v = String(v == null ? '' : v).trim().toLowerCase().slice(0, 120);
  return /^[^\s@,;<>()]+@[^\s@,;<>()]+\.[a-z]{2,}$/.test(v) ? v : '';
}
function hsRand(n) {
  var s = ''; while (s.length < n) s += Math.floor(Math.random() * 0x100000000).toString(16);
  return s.slice(0, n);
}
function hsCode() {
  var L = 'ABCDEFGHJKLMNPQRSTUVWXYZ', A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var s = L.charAt(Math.floor(Math.random() * L.length));
  for (var i = 0; i < 3; i++) s += A.charAt(Math.floor(Math.random() * A.length));
  return s;
}
function hsList(v) { return v ? String(v).split(',').filter(function (x) { return x; }) : []; }
function hsMaskName(n) {
  n = String(n || '');
  if (n.length <= 1) return n + '*';
  if (n.length === 2) return n.charAt(0) + '*';
  return n.charAt(0) + new Array(n.length - 1).join('*') + n.charAt(n.length - 1);
}
function hsPhoneTail(p) { return String(p || '').slice(-4); }

/* ------------------------------ 점수 계산 ------------------------------ */
function hsScore(l) {
  var S = HS_SCORE, parts = [];
  function add(label, pts) { if (pts) parts.push({ label: label, pts: pts }); }
  add('역할', S.role[l.role] || 0);
  add('도입 시기', S.timeline[l.timeline] || 0);
  add('회사 규모', S.companySize[l.companySize] || 0);
  add('관심 솔루션', Math.min(hsList(l.interests).length * S.interestEach, S.interestMax));
  add('상담 신청', l.consult === 'Y' ? S.consult : 0);
  add('소개서 열람', Math.min((Number(l.pdfViews) || 0) * S.pdfEach, S.pdfMax));
  add('영상 시청', Math.min((Number(l.videoViews) || 0) * S.videoEach, S.videoMax));
  add('솔루션 페이지', Math.min((Number(l.linkViews) || 0) * S.linkEach, S.linkMax));
  add('현장 스태프 평가', S.staff[l.staffRating] || 0);
  var score = 0; parts.forEach(function (p) { score += p.pts; });
  var grade = !l.surveyAt ? '' : (score >= HS_GRADE.hot ? 'Hot' : (score >= HS_GRADE.warm ? 'Warm' : 'Cold'));
  return { score: score, grade: grade, parts: parts };
}
function hsRescore(l) { var r = hsScore(l); l.score = r.score; l.grade = r.grade; l.updatedAt = hsNow(); return l; }

/* ------------------------------ 방문객 화면에 내려주는 상태 ------------------------------ */
function hsState(lead, store) {
  var wheel = store.getPrizes().map(function (p) { return { id: p.id, name: p.name, win: p.win === 'Y' }; });
  var wins = store.getDraws().filter(function (d) { return d.leadId === lead.id && d.status !== '부재'; })
    .map(function (d) { return { prize: d.prize, status: d.status, at: d.at }; });
  return {
    ok: true,
    lead: {
      leadId: lead.id, token: lead.token, entryNo: hsPad(lead.seq, 4), name: lead.name, company: lead.company,
      surveyDone: !!lead.surveyAt, interests: hsList(lead.interests), consult: lead.consult === 'Y',
      viewed: hsList(lead.viewed),
      prize: lead.prizeId ? { id: lead.prizeId, name: lead.prizeName, win: lead.prizeWin === 'Y',
        claimCode: lead.claimCode, claimed: !!lead.claimedAt } : null
    },
    contents: store.getContents(),
    wheel: wheel,
    drawWins: wins
  };
}
function hsAuthLead(req, store) {
  var id = String(req.leadId || ''), tk = String(req.token || '');
  if (!/^L\d{1,7}$/.test(id) || !tk) return null;
  var lead = store.findLeadBy('id', id);
  return (lead && lead.token === tk) ? lead : null;
}
function hsPickPrize(prizes) {
  var avail = prizes.filter(function (p) { return Number(p.remaining) !== 0 && Number(p.weight) > 0; });
  if (!avail.length) return null;
  var total = 0; avail.forEach(function (p) { total += Number(p.weight); });
  var r = Math.random() * total;
  for (var i = 0; i < avail.length; i++) { r -= Number(avail[i].weight); if (r < 0) return avail[i]; }
  return avail[avail.length - 1];
}

/* ------------------------------ 요청 처리 ------------------------------ */
function hsHandle(req, store) {
  try {
    req = req || {};
    var a = String(req.action || '');
    if (a === 'ping') return { ok: true, version: HS_VERSION, demo: !!store.isDemo };
    if (a.indexOf('admin.') === 0) {
      var key = String(store.getConfig().ADMIN_KEY || '');
      if (!key || String(req.adminKey || '') !== key) return hsErr('auth', '운영자 비밀번호가 맞지 않습니다.');
      return hsAdmin(a, req, store);
    }
    return hsPublic(a, req, store);
  } catch (e) {
    return hsErr('server', '처리 중 오류가 발생했습니다. (' + (e && e.message ? e.message : e) + ')');
  }
}

function hsPublic(a, req, store) {
  var lead;
  if (a === 'register') {
    var name = hsClean(req.name, 40), company = hsClean(req.company, 80);
    var phone = hsPhone(req.phone), email = hsEmail(req.email);
    if (!name) return hsErr('invalid', '이름을 입력해 주세요.');
    if (!company) return hsErr('invalid', '회사명을 입력해 주세요.');
    if (!email) return hsErr('invalid', '이메일 주소를 확인해 주세요.');
    if (!phone) return hsErr('invalid', '휴대폰 번호를 확인해 주세요.');
    if (req.consentPrivacy !== true) return hsErr('invalid', '개인정보 수집·이용에 동의해 주세요.');
    var existing = store.findLeadBy('phone', phone);
    if (existing) {                       // 같은 번호로 이미 등록 → 이어서 진행
      var st = hsState(existing, store); st.resumed = true; return st;
    }
    if (String(store.getConfig().OPEN || 'Y') !== 'Y') return hsErr('closed', '지금은 이벤트 참여 시간이 아닙니다.');
    var seq = store.nextSeq(), now = hsNow();
    lead = {};
    HS_LEAD_FIELDS.forEach(function (f) { lead[f] = ''; });
    lead.id = 'L' + hsPad(seq, 4); lead.seq = seq; lead.token = 't' + hsRand(20); lead.createdAt = now;
    lead.source = req.source === 'kiosk' ? 'kiosk' : 'qr';
    lead.name = name; lead.company = company; lead.dept = hsClean(req.dept, 60); lead.title = hsClean(req.title, 40);
    lead.email = email; lead.phone = phone;
    lead.consentPrivacy = 'Y ' + now; lead.consentMarketing = req.consentMarketing === true ? 'Y ' + now : 'N';
    lead.pdfViews = 0; lead.videoViews = 0; lead.linkViews = 0; lead.score = 0; lead.updatedAt = now;
    store.appendLead(lead);
    store.logEvent(lead.id, 'register', lead.source);
    return hsState(lead, store);
  }

  lead = hsAuthLead(req, store);
  if (!lead) return hsErr('session', '등록 정보를 찾을 수 없습니다. 다시 등록해 주세요.');

  if (a === 'me') return hsState(lead, store);

  if (a === 'survey') {
    if (!lead.surveyAt) {
      var ans = req.answers || {};
      var ints = (Array.isArray(ans.interests) ? ans.interests : []).map(function (x) { return String(x); })
        .filter(function (x, i, arr) { return /^[a-z0-9_-]{1,20}$/.test(x) && arr.indexOf(x) === i; }).slice(0, 12);
      if (!ints.length) return hsErr('invalid', '관심 솔루션을 하나 이상 선택해 주세요.');
      var pick = function (v) { v = String(v == null ? '' : v); return /^[a-z0-9_-]{1,20}$/.test(v) ? v : ''; };
      lead.industry = pick(ans.industry); lead.companySize = pick(ans.companySize); lead.role = pick(ans.role);
      lead.challenge = pick(ans.challenge); lead.timeline = pick(ans.timeline);
      if (!lead.role || !lead.timeline || !lead.companySize || !lead.industry) return hsErr('invalid', '설문 문항을 모두 선택해 주세요.');
      lead.interests = ints.join(','); lead.surveyAt = hsNow();
      hsRescore(lead); store.saveLead(lead);
      store.logEvent(lead.id, 'survey', lead.interests);
    }
    return hsState(lead, store);
  }

  if (a === 'spin') {
    if (!lead.surveyAt) return hsErr('order', '설문을 먼저 완료해 주세요.');
    if (!lead.prizeId) {
      var prize = hsPickPrize(store.getPrizes());
      if (prize) {
        if (Number(prize.remaining) > 0) { prize.remaining = Number(prize.remaining) - 1; store.savePrize(prize); }
        lead.prizeId = prize.id; lead.prizeName = prize.name; lead.prizeWin = prize.win === 'Y' ? 'Y' : 'N';
      } else {
        lead.prizeId = 'none'; lead.prizeName = '준비한 경품이 모두 소진되었습니다'; lead.prizeWin = 'N';
      }
      if (lead.prizeWin === 'Y') {
        var code = hsCode(), tries = 0;
        while (store.findLeadBy('claimCode', code) && tries++ < 8) code = hsCode();
        lead.claimCode = code;
      }
      lead.prizeAt = hsNow(); lead.updatedAt = lead.prizeAt;
      store.saveLead(lead);
      store.logEvent(lead.id, 'spin', lead.prizeName);
    }
    return hsState(lead, store);
  }

  if (a === 'track') {
    var cid = String(req.contentId || '');
    var content = store.getContents().filter(function (c) { return c.id === cid; })[0];
    if (!content) return hsErr('invalid', '자료를 찾을 수 없습니다.');
    var viewed = hsList(lead.viewed);
    if (viewed.indexOf(cid) < 0) {
      viewed.push(cid); lead.viewed = viewed.join(',');
      if (content.type === 'pdf') lead.pdfViews = (Number(lead.pdfViews) || 0) + 1;
      else if (content.type === 'video') lead.videoViews = (Number(lead.videoViews) || 0) + 1;
      else lead.linkViews = (Number(lead.linkViews) || 0) + 1;
      hsRescore(lead); store.saveLead(lead);
      store.logEvent(lead.id, 'view', cid);
    }
    return { ok: true, viewed: viewed };
  }

  if (a === 'consult') {
    lead.consult = 'Y';
    if (!lead.consultAt) lead.consultAt = hsNow();
    lead.consultMemo = hsClean(req.memo, 500);
    hsRescore(lead); store.saveLead(lead);
    store.logEvent(lead.id, 'consult', lead.consultMemo);
    return hsState(lead, store);
  }

  return hsErr('unknown', '알 수 없는 요청입니다.');
}

function hsAdminLead(l) { var o = {}; HS_LEAD_FIELDS.forEach(function (f) { if (f !== 'token') o[f] = l[f]; }); return o; }

function hsAdmin(a, req, store) {
  var lead, draws;
  if (a === 'admin.login') return { ok: true, demo: !!store.isDemo };

  if (a === 'admin.data') {
    return {
      ok: true, demo: !!store.isDemo, serverTime: hsNow(), open: String(store.getConfig().OPEN || 'Y'),
      leads: store.getLeads().map(hsAdminLead), prizes: store.getPrizes(), draws: store.getDraws(),
      contents: store.getContents()
    };
  }

  if (a === 'admin.open') {
    store.setConfig('OPEN', req.open === 'N' ? 'N' : 'Y');
    return { ok: true, open: req.open === 'N' ? 'N' : 'Y' };
  }

  if (a === 'admin.claim') {
    var code = String(req.code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length !== 4) return hsErr('invalid', '수령 코드 4자리를 입력해 주세요.');
    lead = store.findLeadBy('claimCode', code);
    if (!lead) return hsErr('notfound', '해당 코드의 당첨 내역이 없습니다.');
    var already = !!lead.claimedAt;
    if (req.confirm === true && !already) {
      lead.claimedAt = hsNow(); lead.updatedAt = lead.claimedAt; store.saveLead(lead);
      store.logEvent(lead.id, 'claim', lead.prizeName);
    }
    return { ok: true, already: already, lead: hsAdminLead(lead) };
  }

  if (a === 'admin.lead.update') {
    lead = store.findLeadBy('id', String(req.leadId || ''));
    if (!lead) return hsErr('notfound', '리드를 찾을 수 없습니다.');
    if (req.staffRating != null) lead.staffRating = /^[ABC]$/.test(req.staffRating) ? req.staffRating : '';
    if (req.staffNote != null) lead.staffNote = hsClean(req.staffNote, 500);
    if (req.salesStatus != null) lead.salesStatus = ['', 'SQL 후보', 'SQL 전환', '제외'].indexOf(req.salesStatus) >= 0 ? req.salesStatus : '';
    hsRescore(lead); store.saveLead(lead);
    return { ok: true, lead: hsAdminLead(lead) };
  }

  if (a === 'admin.draw') {
    var prizeName = hsClean(req.prize, 60) || '현장 추첨';
    var count = Math.max(1, Math.min(50, parseInt(req.count, 10) || 1));
    draws = store.getDraws();
    var won = {};
    draws.forEach(function (d) { if (d.status !== '부재') won[d.leadId] = true; if (d.prize === prizeName) won[d.leadId] = true; });
    var pool = store.getLeads().filter(function (l) {
      if (req.pool !== 'all' && !l.surveyAt) return false;
      if (l.salesStatus === '제외') return false;
      return !won[l.id];
    });
    if (!pool.length) return hsErr('empty', '추첨 대상자가 없습니다.');
    var picked = [], now = hsNow();
    for (var i = 0; i < count && pool.length; i++) {
      var w = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
      var d = { id: 'D' + hsPad(draws.length + picked.length + 1, 3), at: now, prize: prizeName, leadId: w.id,
        seq: w.seq, name: w.name, company: w.company, phone: w.phone, status: '당첨' };
      store.appendDraw(d); picked.push(d);
    }
    store.logEvent('', 'draw', prizeName + ' ' + picked.length + '명');
    return { ok: true, winners: picked, poolSize: pool.length + picked.length };
  }

  if (a === 'admin.draw.update') {
    var target = store.getDraws().filter(function (d) { return d.id === String(req.drawId || ''); })[0];
    if (!target) return hsErr('notfound', '추첨 내역을 찾을 수 없습니다.');
    target.status = ['당첨', '수령', '부재'].indexOf(req.status) >= 0 ? req.status : '당첨';
    store.saveDraw(target);
    return { ok: true, draw: target };
  }

  if (a === 'admin.seedDemo' || a === 'admin.resetDemo') {
    if (!store.isDemo) return hsErr('forbidden', '데모 모드에서만 쓸 수 있습니다.');
    if (a === 'admin.resetDemo') { store.reset(); return { ok: true }; }
    return { ok: true, added: hsSeedDemoLeads(store, Math.max(1, Math.min(600, parseInt(req.n, 10) || 200))) };
  }

  return hsErr('unknown', '알 수 없는 요청입니다.');
}

/* ------------------------------ 데모용 샘플 리드 ------------------------------ */
function hsSeedDemoLeads(store, n) {
  var fam = '김이박최정강조윤장임한오서신권황안송류홍'.split('');
  var giv = ['민준', '서연', '도윤', '지우', '하준', '수아', '주원', '지민', '예준', '서현', '시우', '하은', '준서', '유진', '현우', '채원', '지호', '다은', '건우', '소율'];
  var co = ['샘플정밀', '예시전자', '가상화학', '데모물류', '테스트중공업', '샘플에너지', '예시소재', '가상모빌리티', '데모바이오', '테스트금융'];
  var titles = ['사원', '대리', '과장', '차장', '부장', '팀장', '이사', '상무'];
  var depts = ['생산기술팀', 'IT기획팀', '스마트팩토리TF', '물류혁신팀', '인사팀', 'ESG경영팀', '설비보전팀', 'DX추진실'];
  var W = function (pairs) { var t = 0, i; for (i = 0; i < pairs.length; i++) t += pairs[i][1]; var r = Math.random() * t;
    for (i = 0; i < pairs.length; i++) { r -= pairs[i][1]; if (r < 0) return pairs[i][0]; } return pairs[0][0]; };
  var R = function (arr) { return arr[Math.floor(Math.random() * arr.length)]; };
  var sols = ['mes', 'iot', 'wms', 'plm', 'haru', 'tomms', 'esg'];
  var contents = store.getContents(), added = 0;
  for (var k = 0; k < n; k++) {
    var seq = store.nextSeq();
    var hr = W([[9, 3], [10, 8], [11, 10], [12, 5], [13, 7], [14, 11], [15, 9], [16, 6], [17, 3]]);   // 전시장 방문이 몰리는 시간대 흉내
    var at = hsNow().slice(0, 10) + ' ' + hsPad(hr, 2) + ':' + hsPad(Math.floor(Math.random() * 60), 2) + ':' + hsPad(Math.floor(Math.random() * 60), 2);
    var l = {}; HS_LEAD_FIELDS.forEach(function (f) { l[f] = ''; });
    l.id = 'L' + hsPad(seq, 4); l.seq = seq; l.token = 't' + hsRand(20); l.createdAt = at; l.source = 'qr';
    l.name = R(fam) + R(giv); l.company = R(co) + ' ' + String.fromCharCode(65 + Math.floor(Math.random() * 26));
    l.dept = R(depts); l.title = R(titles);
    l.email = 'sample' + hsPad(seq, 4) + '@example.com'; l.phone = '010-0000-' + hsPad(seq % 10000, 4);
    l.consentPrivacy = 'Y ' + at; l.consentMarketing = Math.random() < 0.6 ? 'Y ' + at : 'N';
    l.pdfViews = 0; l.videoViews = 0; l.linkViews = 0; l.score = 0;
    if (Math.random() < 0.9) {
      l.surveyAt = at;
      l.industry = W([['defense', 2], ['electronics', 3], ['chemical', 2], ['machinery', 3], ['logistics', 2], ['finance', 1], ['public', 1], ['etc', 1]]);
      l.companySize = W([['s0', 3], ['s50', 4], ['s300', 3], ['s1000', 2]]);
      l.role = W([['decision', 1], ['evaluate', 3], ['user', 5], ['research', 5], ['other', 2]]);
      l.timeline = W([['m3', 1], ['m6', 2], ['y1', 4], ['undecided', 7], ['none', 4]]);
      l.challenge = W([['visibility', 3], ['equipment', 3], ['logistics', 2], ['product', 1], ['hr', 1], ['esg', 2], ['etc', 1]]);
      var ints = sols.filter(function () { return Math.random() < 0.3; }); if (!ints.length) ints = [R(sols)];
      l.interests = ints.join(',');
      var p = hsPickPrize(store.getPrizes());
      if (p) { if (Number(p.remaining) > 0) { p.remaining = Number(p.remaining) - 1; store.savePrize(p); }
        l.prizeId = p.id; l.prizeName = p.name; l.prizeWin = p.win; l.claimCode = hsCode(); l.prizeAt = at;
        if (Math.random() < 0.7) l.claimedAt = at; }
      var seen = contents.filter(function (c) { return ints.indexOf(c.solution) >= 0 && Math.random() < 0.35; });
      l.viewed = seen.map(function (c) { return c.id; }).join(',');
      seen.forEach(function (c) { if (c.type === 'pdf') l.pdfViews++; else if (c.type === 'video') l.videoViews++; else l.linkViews++; });
      var hotish = (l.role === 'decision' || l.role === 'evaluate') && (l.timeline === 'm3' || l.timeline === 'm6');
      if (Math.random() < (hotish ? 0.45 : 0.04)) { l.consult = 'Y'; l.consultAt = at; l.consultMemo = '도입 일정과 구축 사례 문의'; }
    }
    hsRescore(l); l.updatedAt = at;
    store.appendLead(l); added++;
  }
  return added;
}

/* ------------------------------ 메모리 저장소 (데모 모드·테스트용) ------------------------------ */
function hsMemStore(load, save) {
  function fresh() {
    return { leads: [], prizes: JSON.parse(JSON.stringify(HS_SEED.prizes)), contents: JSON.parse(JSON.stringify(HS_SEED.contents)),
      draws: [], events: [], config: { ADMIN_KEY: '0000', OPEN: 'Y' } };
  }
  var db = load() || fresh();
  function commit() { save(db); }
  function copy(o) { return JSON.parse(JSON.stringify(o)); }
  return {
    isDemo: true,
    reset: function () { db = fresh(); commit(); },
    getConfig: function () { return db.config; },
    setConfig: function (k, v) { db.config[k] = v; commit(); },
    getLeads: function () { return copy(db.leads); },
    findLeadBy: function (field, value) {
      for (var i = 0; i < db.leads.length; i++) if (String(db.leads[i][field]) === String(value)) return copy(db.leads[i]);
      return null;
    },
    nextSeq: function () { var m = 0; db.leads.forEach(function (l) { if (Number(l.seq) > m) m = Number(l.seq); }); return m + 1; },
    appendLead: function (l) { db.leads.push(copy(l)); commit(); },
    saveLead: function (l) {
      for (var i = 0; i < db.leads.length; i++) if (db.leads[i].id === l.id) { db.leads[i] = copy(l); commit(); return; }
    },
    getPrizes: function () { return copy(db.prizes); },
    savePrize: function (p) { for (var i = 0; i < db.prizes.length; i++) if (db.prizes[i].id === p.id) { db.prizes[i] = copy(p); commit(); return; } },
    getContents: function () { return copy(db.contents); },
    getDraws: function () { return copy(db.draws); },
    appendDraw: function (d) { db.draws.push(copy(d)); commit(); },
    saveDraw: function (d) { for (var i = 0; i < db.draws.length; i++) if (db.draws[i].id === d.id) { db.draws[i] = copy(d); commit(); return; } },
    logEvent: function (leadId, kind, detail) { db.events.push({ at: hsNow(), leadId: leadId, kind: kind, detail: detail }); if (db.events.length > 3000) db.events.shift(); }
  };
}

/* ==========================================================================
 * 브라우저 전용 구간 - 서버 호출 (API_URL 이 비어 있으면 데모 모드로 동작)
 * ========================================================================== */
var HS_CFG = window.EVENT_CONFIG || {};
var HS_API_URL = String(HS_CFG.API_URL || '').trim();
var HS_DEMO_KEY = 'hsict_demo_db_v1';
var hsDemoStore = null;

var hsDemoMem = null;
var hsDemoStorageOk = true;
function hsGetDemoStore() {
  if (hsDemoStore) return hsDemoStore;
  hsDemoStore = hsMemStore(function () {
    if (!hsDemoStorageOk) return hsDemoMem;
    try { var raw = localStorage.getItem(HS_DEMO_KEY); return raw ? JSON.parse(raw) : null; }
    catch (e) { hsDemoStorageOk = false; return hsDemoMem; }
  }, function (db) {
    hsDemoMem = db;
    try { localStorage.setItem(HS_DEMO_KEY, JSON.stringify(db)); } catch (e) { /* 저장 불가 환경: 메모리로만 유지 */ }
  });
  return hsDemoStore;
}

function hsCall(action, payload) {
  var req = { action: action };
  Object.keys(payload || {}).forEach(function (k) { req[k] = payload[k]; });
  if (!HS_API_URL) {
    return new Promise(function (resolve) {
      setTimeout(function () {
        hsDemoStore = null;                               // 다른 탭(운영자 화면)의 변경을 반영하려고 매번 다시 읽음
        resolve(JSON.parse(JSON.stringify(hsHandle(req, hsGetDemoStore()))));
      }, 250);
    });
  }
  var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 30000);
  return fetch(HS_API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // Apps Script 는 text/plain 으로 보내야 사전 요청(preflight) 없이 통과
    body: JSON.stringify(req),
    redirect: 'follow',
    signal: ctrl ? ctrl.signal : undefined
  }).then(function (r) {
    clearTimeout(timer);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).catch(function (e) {
    clearTimeout(timer);
    return { ok: false, error: 'network', message: '연결이 원활하지 않습니다. 잠시 후 다시 시도해 주세요.' };
  });
}

window.HSApi = {
  call: hsCall,
  isDemo: !HS_API_URL,
  score: hsScore,
  grade: HS_GRADE,
  maskName: hsMaskName,
  phoneTail: hsPhoneTail,
  pad: hsPad,
  list: hsList
};

})();

  var S = { view: 'loading', lead: null, contents: [], wheel: [], drawWins: [], step: 0, answers: { interests: [] }, showAll: false, spun: false, busy: false };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(sel, root) { return (root || document).querySelector(sel); }
  function sol(id) { return CFG.solutions.filter(function (s) { return s.id === id; })[0]; }
  function toast(msg) { var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.remove('on'); }, 2800); }

  /* ---------- 세션 (같은 폰으로 다시 들어오면 이어서) ---------- */

  function surveyOptions(q) {

  function prizeCard() {
    var p = S.lead.prize;
    if (!p) return '';
    if (!p.win) return '<div class="card"><h3>즉석 경품</h3><p class="muted" style="margin:6px 0 0">' + esc(p.name) + '</p></div>';
    return '<div class="card win"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3>즉석 경품: ' + esc(p.name) + '</h3>' +
      (p.claimed ? '<span class="tag">수령 완료</span>' : '') + '</div>' +
      (p.claimed ? '' : '<p class="muted" style="margin:10px 0 2px">수령 코드</p><div class="code">' + esc(p.claimCode) + '</div><p class="muted" style="margin:8px 0 0">부스 스태프에게 이 화면을 보여 주세요.</p>') + '</div>';
  }
  function materialRow(c) {
    var seen = S.lead.viewed.indexOf(c.id) >= 0;
    var kind = c.type === 'pdf' ? 'PDF' : c.type === 'video' ? '영상' : '웹';
    var inner = '<span class="kind">' + kind + '</span><span class="t">' + esc(c.title) + '</span>' + (seen ? '<span class="seen">열람함</span>' : '');
    var inline = c.type === 'video' && playable(c.url);
    if (c.url && !inline) return '<a class="mat" href="' + esc(c.url) + '" target="_blank" rel="noopener" data-act="track" data-id="' + esc(c.id) + '">' + inner + '</a>';
    return '<button type="button" class="mat" data-act="open" data-id="' + esc(c.id) + '">' + inner + '</button>';
  }
  function solutionBlock(id) {
    var s = sol(id); if (!s) return '';
    var items = S.contents.filter(function (c) { return c.solution === id && (c.url || API.isDemo); });
    return '<section class="sol"><header><h3>' + esc(s.name) + '</h3><p>' + esc(s.desc) + '</p></header>' +
      (items.length ? items.map(materialRow).join('') : '<div class="mat"><span class="t muted">자료를 준비하고 있습니다. 부스에서 직접 안내해 드립니다.</span></div>') + '</section>';
  }
  function viewHome() {
    var L = S.lead, mine = L.interests.filter(sol);
    var others = CFG.solutions.map(function (s) { return s.id; }).filter(function (id) { return mine.indexOf(id) < 0; });
    var wins = S.drawWins.map(function (w) {
      return '<div class="card win"><h3>현장 추첨 당첨: ' + esc(w.prize) + '</h3><p class="muted" style="margin:6px 0 0">' +
        (w.status === '수령' ? '경품을 수령하셨습니다.' : '부스 스태프에게 이 화면을 보여 주세요.') + '</p></div>';
    }).join('');
    return '<div class="pass"><div class="lbl">현장 추첨 응모 번호</div><div class="no">' + esc(L.entryNo) + '</div>' +
      '<div class="who">' + esc(L.name) + '</div><div class="co">' + esc(L.company) + '</div>' +
      '<div class="cut"></div><p class="note">' + esc(EV.drawInfo) + '</p></div>' +
      wins + prizeCard() +
      '<div class="sec"><h2>관심 솔루션 자료</h2><p class="muted">선택하신 솔루션의 소개서와 영상입니다.</p>' + mine.map(solutionBlock).join('') + '</div>' +
      (others.length ? (S.showAll ? '<div class="sec"><h2>다른 솔루션</h2>' + others.map(solutionBlock).join('') + '</div>'
        : '<div style="margin-top:14px"><button class="btn ghost" data-act="more">다른 솔루션 자료도 보기</button></div>') : '') +
      '<div class="sec"><h2>전문가 상담</h2>' +
      (L.consult ? '<div class="card"><span class="tag">상담 신청 완료</span><p style="margin:10px 0 0">담당자가 등록하신 연락처로 연락드립니다.</p><button class="linkbtn" data-act="consult">문의 내용 수정</button></div>'
        : '<p class="muted">도입 일정, 구축 사례, 견적이 궁금하시면 담당자가 직접 연락드립니다.</p><div style="margin-top:12px"><button class="btn dark" data-act="consult">상담 신청하기</button></div>') +
      '</div>' +
      '<div style="margin-top:26px;text-align:center"><button class="linkbtn" data-act="refresh">추첨 결과 새로 고침</button>' +
      (KIOSK ? '<div style="margin-top:8px"><button class="btn ghost" data-act="reset">다음 방문객 등록</button></div>' : '') + '</div>';
  }

  /* ---------- 자료 열기 ---------- */
  function youtubeId(url) { var m = /(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{6,})/.exec(url || ''); return m ? m[1] : ''; }
  function playable(url) { return !!youtubeId(url) || /\.(mp4|webm|mov)(\?|#|$)/i.test(url || ''); }
  function track(id) {
    if (S.lead.viewed.indexOf(id) < 0) S.lead.viewed.push(id);
    API.call('track', Object.assign({ contentId: id }, auth()));
    var el = app.querySelector('[data-id="' + id + '"]');
    if (el && !el.querySelector('.seen')) el.insertAdjacentHTML('beforeend', '<span class="seen">열람함</span>');
  }
  function openContent(id) {
    var c = S.contents.filter(function (x) { return x.id === id; })[0]; if (!c) return;
    track(id);
    var body;
    if (!c.url) body = '<p class="muted">데모 모드에서는 자료 대신 이 안내가 열립니다. 구글 시트의 Contents 탭에 링크를 넣으면 실제 자료가 열립니다.</p>';
    else if (youtubeId(c.url)) body = '<iframe class="player" src="https://www.youtube-nocookie.com/embed/' + esc(youtubeId(c.url)) + '?playsinline=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="' + esc(c.title) + '"></iframe>';
    else body = '<video class="player" src="' + esc(c.url) + '" controls playsinline preload="metadata"></video>';
    openSheet('<button class="close" data-act="close">닫기</button><h2>' + esc(c.title) + '</h2>' + body);
  }
  function openSheet(html) { sheet.innerHTML = html; scrim.classList.add('on'); var f = sheet.querySelector('textarea, button'); if (f) f.focus(); }
  function closeSheet() { scrim.classList.remove('on'); sheet.innerHTML = ''; }

  function openConsult() {
    var names = S.lead.interests.map(function (id) { var s = sol(id); return s ? s.name : ''; }).filter(Boolean).join(', ');
    openSheet('<button class="close" data-act="close">닫기</button><h2>상담 신청</h2>' +
      '<p class="muted">등록하신 연락처로 담당자가 연락드립니다.' + (names ? ' 관심 솔루션: ' + esc(names) : '') + '</p>' +
      '<div class="field" style="margin-top:14px"><label for="c-memo">궁금한 점 (선택)</label><textarea id="c-memo" rows="4" maxlength="500" placeholder="예: 공장 2곳에 MES 도입 검토 중, 구축 기간 문의"></textarea></div>' +
      '<div class="err" id="conserr" role="alert"></div><button class="btn" data-act="consult-send" id="consbtn">상담 신청 보내기</button>');
  }

  /* ---------- 동작 ---------- */
  function busy(btn, on, label) { if (!btn) return; if (on) { btn.dataset.label = btn.textContent; btn.textContent = label || '처리 중입니다'; btn.disabled = true; } else { btn.textContent = btn.dataset.label || btn.textContent; btn.disabled = false; } }

  function submitRegister(form) {
    var err = $('#regerr'), btn = $('#regbtn'), v = function (n) { return form.elements[n].value.trim(); };
    err.textContent = '';
    if (!v('name')) { err.textContent = '이름을 입력해 주세요.'; form.elements.name.focus(); return; }
    if (!v('company')) { err.textContent = '회사명을 입력해 주세요.'; form.elements.company.focus(); return; }
    if (!/^[^\s@]+@[^\s@]+\.[A-Za-z]{2,}$/.test(v('email'))) { err.textContent = '이메일 주소를 확인해 주세요.'; form.elements.email.focus(); return; }
    if (!/^01[016789]\d{7,8}$/.test(v('phone').replace(/\D/g, ''))) { err.textContent = '휴대폰 번호를 확인해 주세요. 예: 010-1234-5678'; form.elements.phone.focus(); return; }
    if (!$('#c-privacy').checked) { err.textContent = '개인정보 수집·이용에 동의해 주세요.'; $('#c-privacy').focus(); return; }
    busy(btn, true, '등록하는 중입니다');
    API.call('register', { name: v('name'), company: v('company'), dept: v('dept'), title: v('title'), email: v('email'), phone: v('phone'),
      consentPrivacy: true, consentMarketing: $('#c-marketing').checked, source: KIOSK ? 'kiosk' : 'qr' }).then(function (res) {
      if (!res.ok) { busy(btn, false); err.textContent = res.message; return; }
      applyState(res);
      if (res.resumed) toast('이미 등록된 번호입니다. 이어서 진행합니다.');
      routeByLead();
    });
  }

  function submitSurvey() {
    var btn = $('#nextbtn'), err = $('#surverr');
    busy(btn, true, '제출하는 중입니다');
    API.call('survey', Object.assign({ answers: S.answers }, auth())).then(function (res) {
      if (!res.ok) { busy(btn, false); err.textContent = res.message; return; }
      applyState(res); routeByLead();
    });
  }

  function doSpin() {
    var btn = $('#spinbtn'), err = $('#spinerr');
    err.textContent = ''; busy(btn, true, '추첨하는 중입니다');
    API.call('spin', auth()).then(function (res) {
      if (!res.ok) { busy(btn, false); err.textContent = res.message; return; }
      var prize = res.lead.prize, segs = wheelSegs(), n = segs.length, step = 360 / n, idx = -1;
      segs.forEach(function (s, i) { if (idx < 0 && s.id === prize.id) idx = i; });
      if (idx < 0) idx = 0;
      var target = 360 * 6 - (idx * step + step / 2) + (Math.random() - 0.5) * step * 0.5;
      var svg = $('#wheel'), done = false;
      function finish() {
        if (done) return; done = true;
        applyState(res);
        $('#spinout').innerHTML = '<div class="result">' + (prize.win
          ? '<div class="muted">당첨되셨습니다</div><div class="prize">' + esc(prize.name) + '</div><div class="muted">수령 코드</div><div class="code">' + esc(prize.claimCode) + '</div>'
          : '<div class="prize" style="font-size:18px">' + esc(prize.name) + '</div><div class="muted">현장 추첨에는 자동으로 응모되었습니다.</div>') + '</div>';
        btn.disabled = false; btn.textContent = '내 응모 번호와 자료 보기'; btn.dataset.act = 'home';
      }
      svg.addEventListener('transitionend', finish);
      setTimeout(finish, 5200);
      requestAnimationFrame(function () { svg.style.transform = 'rotate(' + target.toFixed(1) + 'deg)'; });
    });
  }

  function refresh(quiet) {
    return API.call('me', auth()).then(function (res) {
      if (res.ok) { applyState(res); if (S.view === 'home') render(); if (!quiet) toast(S.drawWins.length ? '당첨 내역이 있습니다.' : '아직 당첨 내역이 없습니다.'); }
      else if (!quiet) toast(res.message);
      return res;
    });
  }

  app.addEventListener('submit', function (e) { if (e.target.id === 'regform') { e.preventDefault(); submitRegister(e.target); } });
  app.addEventListener('change', function (e) {
    if (e.target.id === 'c-all') { $('#c-privacy').checked = $('#c-marketing').checked = e.target.checked; }
    else if (e.target.id === 'c-privacy' || e.target.id === 'c-marketing') { $('#c-all').checked = $('#c-privacy').checked && $('#c-marketing').checked; }
  });

  document.addEventListener('click', function (e) {
    if (e.target === scrim) { closeSheet(); return; }
    var el = e.target.closest('[data-act]'); if (!el) return;
    var act = el.dataset.act, id = el.dataset.id;
    if (act === 'start') { S.view = 'register'; render(); }
    else if (act === 'opt') {
      var q = CFG.survey[S.step];
      if (q.multi) {
        var arr = S.answers[q.key] || (S.answers[q.key] = []), i = arr.indexOf(id);
        if (i >= 0) arr.splice(i, 1); else arr.push(id);
        el.classList.toggle('on', i < 0); el.setAttribute('aria-pressed', String(i < 0));
        var nb = $('#nextbtn'); if (nb) nb.disabled = arr.length === 0;
      } else {
        S.answers[q.key] = id;
        if (S.step < CFG.survey.length - 1) { S.step++; render(); } else render();
      }
    }
    else if (act === 'next') { if (S.step < CFG.survey.length - 1) { S.step++; render(); } else submitSurvey(); }
    else if (act === 'prev') { S.step--; render(); }
    else if (act === 'spin') doSpin();
    else if (act === 'home') { S.view = 'home'; render(); }
    else if (act === 'more') { S.showAll = true; render(); }
    else if (act === 'track') track(id);                       // 링크는 그대로 새 탭에서 열림
    else if (act === 'open') openContent(id);
    else if (act === 'close') closeSheet();
    else if (act === 'consult') openConsult();
    else if (act === 'consult-send') {
      var b = $('#consbtn'); busy(b, true, '보내는 중입니다');
      API.call('consult', Object.assign({ memo: $('#c-memo').value }, auth())).then(function (res) {
        if (!res.ok) { busy(b, false); $('#conserr').textContent = res.message; return; }
        applyState(res); closeSheet(); render(); toast('상담 신청을 보냈습니다.');
      });
    }
    else if (act === 'refresh') refresh(false);
    else if (act === 'reset') { clearSession(); S.lead = null; S.answers = { interests: [] }; S.showAll = false; S.view = 'intro'; render(); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

  /* ---------- 시작 ---------- */
  var brand = document.getElementById('brand');
  if (EV.logo) {
    brand.classList.add('has-logo'); brand.innerHTML = '<img src="' + esc(EV.logo) + '" alt=""><span>' + esc(EV.client) + '</span>';
    var fav = document.createElement('link'); fav.rel = 'icon'; fav.href = EV.logo; document.head.appendChild(fav);
  } else brand.textContent = EV.client;
  document.getElementById('expo').textContent = [EV.expo, EV.booth].filter(Boolean).join('  |  ');
  document.title = EV.client + ' 부스 이벤트';
  if (API.isDemo) document.getElementById('demo').hidden = false;

  var sess = loadSession();
  if (sess && sess.leadId) {
    S.lead = sess;
    API.call('me', sess).then(function (res) {
      if (res.ok) { applyState(res); routeByLead(); }
      else if (res.error === 'network') { app.innerHTML = '<div class="loading">' + esc(res.message) + '<div style="margin-top:16px"><button class="btn small" onclick="location.reload()">다시 시도</button></div></div>'; }
      else { clearSession(); S.lead = null; S.view = 'intro'; render(); }
    });
  } else { S.view = 'intro'; render(); }
})();
</script>
</body>
</html>
